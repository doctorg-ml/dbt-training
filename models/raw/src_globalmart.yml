version: 2

sources:
  - name: globalmart
    description: a clone of the Snowflake database
    database: raw # Database where the source tables are located
    schema: globalmart # Schema containing the source tables
    tables:
      - name: customer # Source table for customer data
      - name: orders # Source table for order data
        description: raw orders table
        columns:
          - name: orderid
            description: primary key for orders
            tests:
              - unique
              - not_null
      - name: product # Source table for product data
